<style>body{width:1080px;height:1080px}.card{width:1080px;height:1080px;padding:72px;display:flex;flex-direction:column;position:relative;background:var(--night);color:var(--chalk);overflow:hidden;isolation:isolate}
.shot{position:absolute;left:0;right:0;bottom:0;height:640px;z-index:-1}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%}
.shot svg{position:absolute;inset:0;width:100%;height:100%}
.shot::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--night) 0%,rgba(10,22,34,.25) 26%,rgba(10,22,34,0) 55%,rgba(10,22,34,.55) 100%);pointer-events:none}
.brand{font-size:34px;color:var(--chalk)}.brand svg{width:48px;height:44px}
h1{font-size:76px;margin-top:44px;max-width:900px}p.sub{font-size:30px;color:var(--chalk-2);margin-top:20px;max-width:860px;line-height:1.35}
.foot{margin-top:auto;display:flex;justify-content:space-between;font-size:20px;color:var(--chalk-2);position:relative;z-index:1}</style></head><body>
